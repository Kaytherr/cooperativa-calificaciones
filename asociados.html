<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asociados</title>
<link rel="stylesheet" href="style.css">

<style>

.topbar{
display:grid;
grid-template-columns:1fr 220px 140px;
gap:15px;
margin-bottom:25px;
}

.topbar input,
.topbar select,
.topbar button{
padding:12px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
}

#contenedor{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:20px;
}

.card-asoc{
background:white;
border-radius:18px;
padding:20px;
box-shadow:0 8px 18px rgba(0,0,0,.08);
display:flex;
gap:15px;
align-items:flex-start;
}

.card-asoc img{
width:95px;
height:95px;
border-radius:50%;
object-fit:cover;
flex-shrink:0;
}

.info{
flex:1;
}

.info h3{
margin-bottom:8px;
color:#1f4f68;
font-size:22px;
}

.info p{
margin:4px 0;
font-size:15px;
}

.estado{
font-weight:bold;
margin-top:6px;
}

.vigente{
color:green;
}

.novigente{
color:red;
}

.rating{
font-weight:bold;
margin-top:8px;
}

.verperfil{
margin-top:12px;
display:inline-block;
background:#1f4f68;
color:white;
padding:10px 14px;
border-radius:10px;
text-decoration:none;
}

.lista{
display:block !important;
}

.lista .card-asoc{
display:grid;
grid-template-columns:90px 1fr 140px;
align-items:center;
gap:18px;
margin-bottom:12px;
padding:18px;
border-radius:14px;
min-height:auto;
}

.lista .card-asoc img{
width:70px;
height:70px;
}

.lista .card-asoc .info{
display:grid;
grid-template-columns:repeat(2,minmax(180px,1fr));
gap:4px 20px;
align-items:center;
}

.lista .card-asoc .info h3{
grid-column:1 / -1;
margin-bottom:6px;
font-size:24px;
}

.lista .card-asoc .verperfil{
margin:0;
justify-self:end;
align-self:center;
}

@media(max-width:768px){

.lista .card-asoc{
grid-template-columns:1fr;
text-align:center;
}

.lista .card-asoc .info{
grid-template-columns:1fr;
}

.lista .card-asoc .verperfil{
justify-self:center;
margin-top:10px;
}

}

#paginacion{
margin-top:25px;
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
}

#paginacion button{
padding:10px 14px;
border:none;
background:#1f4f68;
color:white;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

#paginacion button:hover{
background:#16394b;
}

#paginacion .activo{
background:#0f2b39;
}

@media(max-width:768px){

.topbar{
grid-template-columns:1fr;
}

#contenedor{
grid-template-columns:1fr;
}

.card-asoc{
flex-direction:column;
text-align:center;
align-items:center;
}

.card-asoc img{
width:110px;
height:110px;
}

}

</style>
</head>
<body>

<header>
<div class="logo">
<img src="FOTOS/logo.jpg">
<span>C.I.O.S</span>
</div>

<nav>
<a href="index.html">Inicio</a>
<a href="nosotros.html">Nosotros</a>
<a href="novedades.html">Novedades</a>
<a href="asociados.html">Asociados</a>
<a href="contacto.html">Contacto</a>
</nav>
</header>

<main>

<h1>Asociados</h1>

<div class="topbar">

<input type="text" id="buscar" placeholder="Buscar por nombre o matrícula">

<select id="ordenar">
<option value="az">Orden A-Z</option>
<option value="matricula">Matrícula</option>
<option value="rating">Mejor puntuados</option>
</select>

<button onclick="cambiarVista()">Tarjetas / Lista</button>

</div>

<div id="contenedor"></div>
<div id="paginacion"></div>

</main>

<footer>© 2026 C.I.O.S</footer>

<script>

const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTYtWCGqYY1syX0O952yzEl9YIA1fe7ORQLpDIiWz4s51ySBD_grl9iRbdsAkXzv68hJJKfVkTPmzGJ/pub?gid=0&single=true&output=csv";

let asociados = [];
let vistaLista = false;
let paginaActual = 1;
let porPagina = 8;

fetch(url)
.then(r => r.text())
.then(data => {

const filas = data.trim().split("\n");

for(let i=1;i<filas.length;i++){

let c = filas[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);

asociados.push({

id:c[0].replaceAll('"','').trim(),
nombre:c[1].replaceAll('"','').trim(),
matricula:c[2].replaceAll('"','').trim(),
direccion:c[3].replaceAll('"','').trim(),
telefono:c[4].replaceAll('"','').trim(),
categoria:c[5].replaceAll('"','').trim(),
rating:parseFloat(c[6].replaceAll('"','').replace(",",".")) || 0,
cantidad:c[7].replaceAll('"','').trim(),
formulario:c[8].replaceAll('"','').trim(),
foto:c[9].replaceAll('"','').trim(),
estado:c[10].replaceAll('"','').trim()

});

}

render();

});

function render(){

let lista = [...asociados];

let txt = document.getElementById("buscar").value.toLowerCase();

lista = lista.filter(a =>
a.nombre.toLowerCase().includes(txt) ||
a.matricula.toLowerCase().includes(txt)
);

let orden = document.getElementById("ordenar").value;

if(orden=="az"){
lista.sort((a,b)=>a.nombre.localeCompare(b.nombre));
}

if(orden=="matricula"){
lista.sort((a,b)=>a.matricula.localeCompare(b.matricula));
}

if(orden=="rating"){
lista.sort((a,b)=>b.rating-a.rating);
}

let totalPaginas = Math.ceil(lista.length / porPagina);

if(paginaActual > totalPaginas){
paginaActual = 1;
}

let inicio = (paginaActual - 1) * porPagina;
let fin = inicio + porPagina;

let mostrar = lista.slice(inicio, fin);

let html = "";

mostrar.forEach(a => {

html += `
<div class="card-asoc">

<img src="${a.foto || 'https://via.placeholder.com/100'}">

<div class="info">

<h3>${a.nombre}</h3>

<p><b>Matrícula:</b> ${a.matricula}</p>

<p><b>Teléfono:</b>
<a href="tel:${a.telefono}">
${a.telefono}
</a>
</p>

<p><b>Categoría:</b> ${a.categoria}</p>

<p class="rating">
⭐ ${a.rating.toFixed(2)} (${a.cantidad})
</p>

<p class="estado ${a.estado=='Vigente' ? 'vigente':'novigente'}">
${a.estado}
</p>

<a class="verperfil" href="empleado.html?id=${a.id}">
Ver perfil
</a>

</div>
</div>
`;

});

document.getElementById("contenedor").innerHTML = html;

if(vistaLista){
document.getElementById("contenedor").classList.add("lista");
}else{
document.getElementById("contenedor").classList.remove("lista");
}

let pagHTML = "";

if(totalPaginas > 1){

if(paginaActual > 1){
pagHTML += `<button onclick="cambiarPagina(${paginaActual-1})">◀</button>`;
}

for(let i=1;i<=totalPaginas;i++){

pagHTML += `
<button class="${i==paginaActual ? 'activo':''}"
onclick="cambiarPagina(${i})">
${i}
</button>
`;

}

if(paginaActual < totalPaginas){
pagHTML += `<button onclick="cambiarPagina(${paginaActual+1})">▶</button>`;
}

}

document.getElementById("paginacion").innerHTML = pagHTML;

}

document.getElementById("buscar").addEventListener("input", () => {
paginaActual = 1;
render();
});

document.getElementById("ordenar").addEventListener("change", () => {
paginaActual = 1;
render();
});

function cambiarVista(){
vistaLista = !vistaLista;
render();
}

function cambiarPagina(n){
paginaActual = n;
render();
}

</script>

</body>
</html>
