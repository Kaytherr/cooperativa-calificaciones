<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>Perfil del asociado</title>

<style>

body{
font-family: Arial;
background:#2c5d73;
color:white;
text-align:center;
margin:0;
padding:20px;
}

/* LOGO */
.header{
  width:100%;
  display:flex;
  justify-content:flex-start;
  align-items:center;
  margin-bottom:20px;
}

.logo-header{
  width:100px;
  cursor:pointer;
  transition:0.3s;
}

.logo-header:hover{
  transform:scale(1.05);
}

/* TARJETA */
.card{
background:white;
color:black;
padding:40px;
border-radius:20px;
max-width:350px;
margin:auto;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* FOTO */
#foto{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
margin-bottom:15px;
}

/* TEXTO */
.info p{
margin:10px 0;
font-size:18px;
}

.titulo{
font-weight:bold;
}

/* ESTADO */
.estado{
font-weight:bold;
margin-top:10px;
}

/* RATING */
.rating{
font-size:22px;
font-weight:bold;
margin:10px 0;
}

/* BOTÓN */
button{
background:#2c5d73;
color:white;
border:none;
padding:15px;
border-radius:10px;
font-size:18px;
cursor:pointer;
width:100%;
transition:0.3s;
}

button:hover{
background:#1f4557;
transform:scale(1.05);
}

</style>
</head>

<body>

<div class="header">
  <a href="index.html">
    <img src="logo.jpg" class="logo-header">
  </a>
</div>

<h2>Perfil del asociado</h2>

<div class="card">

<img id="foto" src="https://via.placeholder.com/120">

<h2 id="nombre">Cargando...</h2>

<div class="info">
<p id="matricula"></p>
<p id="direccion"></p>
<p id="telefono"></p>
<p id="categoria"></p>
<p id="estado" class="estado"></p>
</div>

<div id="rating" class="rating">Cargando...</div>

<br>

<a id="boton" href="#">
<button>Calificar asociado</button>
</a>

</div>

<script>

// refresca cada 60s
setInterval(() => location.reload(), 60000);

// obtener ID de la URL
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

// CSV
const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTYtWCGqYY1syX0O952yzEl9YIA1fe7ORQLpDIiWz4s51ySBD_grl9iRbdsAkXzv68hJJKfVkTPmzGJ/pub?gid=0&single=true&output=csv";

fetch(url)
.then(res => res.text())
.then(data => {

const filas = data.trim().split("\n");
let encontrado = false;

for(let i=1;i<filas.length;i++){

let columnas = filas[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);

let trabajadorID = columnas[0].replaceAll('"',"").trim();
let nombre = columnas[1].replaceAll('"',"").trim();
let matricula = columnas[2].replaceAll('"',"").trim();
let direccion = columnas[3].replaceAll('"',"").trim();
let telefono = columnas[4].replaceAll('"',"").trim();
let categoria = columnas[5].replaceAll('"',"").trim();
let promedio = columnas[6].replaceAll('"',"").replace(",",".").trim();
let cantidad = columnas[7].replaceAll('"',"").trim();
let formulario = columnas[8].replaceAll('"',"").trim();
let foto = columnas[9].replaceAll('"',"").trim();
let estado = columnas[10].replaceAll('"',"").trim();

if(trabajadorID.replace(/^0+/, '') === id.replace(/^0+/, '')){

encontrado = true;

// datos
document.getElementById("nombre").innerText = nombre;

document.getElementById("matricula").innerHTML = "<span class='titulo'> Matrícula:</span> " + matricula;
document.getElementById("direccion").innerHTML = "<span class='titulo'> Dirección:</span> " + direccion;
document.getElementById("telefono").innerHTML = "<span class='titulo'> Teléfono:</span> " + telefono;
document.getElementById("categoria").innerHTML = "<span class='titulo'> Categoría:</span> " + categoria;

// estado
if(estado === "Vigente"){
  document.getElementById("estado").innerHTML = "🟢 Vigente";
  document.getElementById("estado").style.color = "green";
} else {
  document.getElementById("estado").innerHTML = "🔴 No vigente";
  document.getElementById("estado").style.color = "red";
}

// rating
if(promedio === "" || promedio === "0"){
document.getElementById("rating").innerText = "Sin calificaciones";
} else {
let promedioNum = parseFloat(promedio);
let promedioRedondeado = promedioNum.toFixed(2);

document.getElementById("rating").innerText =
"⭐ " + promedioRedondeado + " / 5 (" + cantidad + " opiniones)";
}

// botón
document.getElementById("boton").href = formulario;

// foto
if(foto !== ""){
  document.getElementById("foto").src = foto;
}

}

}

if(!encontrado){
document.body.innerHTML = "<h2>Trabajador no encontrado</h2>";
}

});

</script>

</body>
</html>
