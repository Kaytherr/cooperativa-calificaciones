<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>Perfil del trabajador</title>

<style>

body{
font-family: Arial;
background:#2f6f8f;
color:white;
text-align:center;
margin:0;
padding:20px;
}

.card{
background:white;
color:black;
padding:30px;
border-radius:15px;
max-width:350px;
margin:auto;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

#foto{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
margin-bottom:15px;
}

.rating{
font-size:22px;
font-weight:bold;
margin:10px 0;
}

#estado{
font-weight:bold;
margin:10px 0;
}

button{
background:#2f6f8f;
color:white;
border:none;
padding:15px;
border-radius:10px;
font-size:18px;
cursor:pointer;
width:100%;
transition:0.3s;
}

button:hover{
background:#24596f;
}

</style>
</head>

<body>

<h2>Perfil del trabajador</h2>

<div class="card">

<img id="foto" src="">

<h2 id="nombre">Cargando...</h2>

<p id="matricula"></p>
<p id="direccion"></p>
<p id="telefono"></p>
<p id="categoria"></p>
<p id="estado"></p>

<div id="rating" class="rating">Cargando...</div>

<div id="estado"></div>

<br>

<a id="boton" href="#">
<button>Calificar trabajador</button>
</a>

</div>

<script>

// refresca cada 60s
setInterval(() => location.reload(), 60000);

// obtener ID de la URL
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

// 🔴 CAMBIAR ESTE LINK POR TU CSV
const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTYtWCGqYY1syX0O952yzEl9YIA1fe7ORQLpDIiWz4s51ySBD_grl9iRbdsAkXzv68hJJKfVkTPmzGJ/pub?gid=0&single=true&output=csv";

fetch(url)
.then(res => res.text())
.then(data => {

const filas = data.trim().split("\n");
let encontrado = false;

for(let i=1;i<filas.length;i++){

let columnas = filas[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);

// ⚠️ AJUSTADO A TU BASE
let trabajadorID = columnas[0].replaceAll('"',"").trim(); // ID
let nombre = columnas[1].replaceAll('"',"").trim(); // Nombre
let matricula = columnas[2].replaceAll('"',"").trim();
let direccion = columnas[3].replaceAll('"',"").trim();
let telefono = columnas[4].replaceAll('"',"").trim();
let categoria = columnas[5].replaceAll('"',"").trim();
let promedio = columnas[6].replaceAll('"',"").replace(",",".").trim(); // Promedio
let cantidad = columnas[7].replaceAll('"',"").trim(); // Cantidad
let formulario = columnas[8].replaceAll('"',"").trim(); // Link form
let foto = columnas[9].replaceAll('"',"").trim(); // Foto
let estado = columnas[10].replaceAll('"',"").trim(); // Estado

if(trabajadorID.trim().replace(/^0+/, '') === id.trim().replace(/^0+/, '')){

encontrado = true;

// nombre
document.getElementById("nombre").innerText = nombre;

document.getElementById("matricula").innerText = "n.º Matrícula: " + matricula;
document.getElementById("direccion").innerText = "Dirección: " + direccion;
document.getElementById("telefono").innerText = "Teléfono: " + telefono;
document.getElementById("categoria").innerText = "Categoría: " + categoria;


if(estado === "Vigente"){
  document.getElementById("estado").innerHTML = "🟢 Vigente";
  document.getElementById("estado").style.color = "green";
} else {
  document.getElementById("estado").innerHTML = "🔴 No vigente";
  document.getElementById("estado").style.color = "red";
}

// promedio
if(promedio === "" || promedio === "0"){
document.getElementById("rating").innerText = "Sin calificaciones";
} else {
let promedioNum = parseFloat(promedio);

let promedioRedondeado = promedioNum.toFixed(2);

document.getElementById("rating").innerText = 
"⭐ " + promedioRedondeado + " / 5 (" + cantidad + " opiniones)";
}


if(estado === "Sancionado"){
document.getElementById("estado").style.color = "red";
}

// botón
document.getElementById("boton").href = formulario;


// foto
if(foto !== ""){
document.getElementById("foto").src = foto;

if(foto !== ""){
  document.getElementById("foto").src = foto;
} else {
  document.getElementById("foto").src = "https://via.placeholder.com/120";
}
}

}

}

// si no encuentra
if(!encontrado){
document.body.innerHTML = "<h2>Trabajador no encontrado</h2>";
}

});


</script>

</body>
</html>
