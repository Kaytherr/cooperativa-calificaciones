<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Perfil Asociado</title>

<link rel="stylesheet" href="style.css">

<style>

.perfil-container{
max-width:500px;
margin:auto;
padding:25px 15px;
}

/* CARD */

.perfil-card{
background:white;
border-radius:30px;
padding:30px 22px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
text-align:center;
}

/* FOTO */

.perfil-foto img{
width:170px;
height:170px;
border-radius:50%;
object-fit:cover;
border:5px solid #f1f1f1;
background:#eee;
}

/* NOMBRE */

.perfil-info h1{
font-size:34px;
margin-top:20px;
margin-bottom:8px;
color:#1f4f68;
line-height:1.1;
}

.categoria{
font-size:18px;
color:#666;
margin-bottom:18px;
}

/* ESTADO */

.estado{
display:inline-block;
padding:12px 20px;
border-radius:999px;
font-weight:bold;
font-size:16px;
margin-bottom:20px;
}

.estado-ok{
background:#dff5e1;
color:#178a2f;
}

.estado-bad{
background:#ffe0e0;
color:#c62828;
}

/* ESTRELLAS */

.stars{
font-size:34px;
margin-bottom:8px;
}

.rating-text{
font-size:18px;
color:#555;
margin-bottom:25px;
}

/* INFO */

.info-box{
background:#f7f7f7;
border-radius:18px;
padding:18px;
margin-bottom:15px;
}

.info-box h3{
font-size:14px;
color:#666;
margin-bottom:8px;
}

.info-box p{
font-size:20px;
font-weight:bold;
color:#222;
word-break:break-word;
}

/* SANCION */

.sancion{
margin-top:20px;
padding:16px;
border-radius:18px;
font-weight:bold;
font-size:16px;
}

.sem-sancion{
background:#e8f8ea;
color:#178a2f;
}

.con-sancion{
background:#fff3cd;
color:#9a6700;
}

/* VERIFICACION */

.verificado{
margin-top:25px;
font-size:15px;
color:#666;
}

/* BOTON */

.btn-calificar{
margin-top:25px;
display:block;
width:100%;
padding:18px;
border-radius:18px;
background:#1f4f68;
color:white;
font-size:18px;
font-weight:bold;
text-decoration:none;
transition:.3s;
}

.btn-calificar:hover{
background:#16394b;
transform:translateY(-2px);
}

</style>
</head>

<body>

<main class="perfil-container">

<div id="perfil"></div>

</main>

<script>

const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTYtWCGqYY1syX0O952yzEl9YIA1fe7ORQLpDIiWz4s51ySBD_grl9iRbdsAkXzv68hJJKfVkTPmzGJ/pub?gid=0&single=true&output=csv";

const params = new URLSearchParams(window.location.search);

const id = params.get("id");

fetch(url)
.then(r => r.text())
.then(data => {

const filas = data.trim().split("\n");

let asociado = null;

for(let i=1;i<filas.length;i++){

let c = filas[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);

let obj = {

id:c[0].replaceAll('"','').trim(),
nombre:c[1].replaceAll('"','').trim(),
matricula:c[2].replaceAll('"','').trim(),
direccion:c[3].replaceAll('"','').trim(),
telefono:c[4].replaceAll('"','').trim(),
categoria:c[5].replaceAll('"','').trim(),
rating:parseFloat(c[6].replaceAll('"','').replace(",",".")) || 0,
cantidad:c[7].replaceAll('"','').trim(),
formulario:c[8].replaceAll('"','').trim(),
foto:c[9].replaceAll('"','').trim(),
estado:c[10].replaceAll('"','').trim(),
sancion:c[11]?.replaceAll('"','').trim() || ""

};

if(obj.id == id){
asociado = obj;
break;
}

}

if(!asociado){

document.getElementById("perfil").innerHTML = `
<h1>Asociado no encontrado</h1>
`;

return;

}

render(asociado);

});

function render(a){

document.title = a.nombre + " | C.I.O.S";

document.getElementById("perfil").innerHTML = `

<div class="perfil-card">

<div class="perfil-foto">

<img
src="${a.foto && a.foto.startsWith('http')
? a.foto
: 'FOTOS/default-user.jpg'}"
>

</div>

<div class="perfil-info">

<h1>${a.nombre}</h1>

<div class="categoria">
Categoría ${a.categoria}
</div>

<div class="estado ${
a.estado.toLowerCase() == "vigente"
? "estado-ok"
: "estado-bad"
}">

${a.estado.toLowerCase() == "vigente"
? "🟢 Asociado habilitado"
: "🔴 Asociado suspendido"}

</div>

<div class="stars">
${generarEstrellas(a.rating)}
</div>

<div class="rating-text">
${a.rating.toFixed(1)} de puntuación
</div>

<div class="info-box">

<h3>Matrícula</h3>

<p>${a.matricula}</p>

</div>

<div class="info-box">

<h3>Teléfono</h3>

<p>

<a
href="tel:${a.telefono}"
style="
text-decoration:none;
color:#222;
"
>
${a.telefono}
</a>

</p>

</div>

<div class="sancion ${
a.sancion
? "con-sancion"
: "sem-sancion"
}">

${
a.sancion
? "⚠ Posee sanciones registradas"
: "✔ Sin sanciones"
}

</div>

<a
class="btn-calificar"
href="${a.formulario}"
target="_blank"
>
Calificar asociado
</a>

<div class="verificado">
✔ Perfil verificado por C.I.O.S
</div>

</div>

</div>

`;

}

function generarEstrellas(rating){

let estrellas = "";

let completas = Math.round(rating);

for(let i=0;i<5;i++){

if(i < completas){
estrellas += "⭐";
}
else{
estrellas += "☆";
}

}

return estrellas;

}

</script>

</body>
</html>
